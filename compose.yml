services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: league
      POSTGRES_USER: league
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league -d league"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: adobe/s3mock:4.11.0
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: league-public,league-private
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:9000:9090"]
    volumes: ["media-data:/s3mockroot"]
  backend:
    restart: unless-stopped
    build: {context: ., dockerfile: infrastructure/Dockerfile.backend}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: Postgres
      ConnectionStrings__League: Host=postgres;Database=league;Username=league;Password=${POSTGRES_PASSWORD}
      FrontendOrigin: ${FRONTEND_ORIGINS:-http://localhost:3000}
      Storage__Endpoint: http://storage:9090
      Storage__Region: us-east-1
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__PublicBucket: league-public
      Storage__PrivateBucket: league-private
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
    volumes: ["identity-keys:/home/app/.aspnet/DataProtection-Keys"]
    healthcheck:
      test: ["CMD", "dotnet", "League.Api.dll", "healthcheck"]
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 12
  frontend:
    restart: unless-stopped
    build: {context: ., dockerfile: infrastructure/Dockerfile.frontend, args: {BACKEND_URL: "http://backend:8080"}}
    ports: ["0.0.0.0:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
  media-data:
  identity-keys:
